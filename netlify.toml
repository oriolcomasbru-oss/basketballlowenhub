[build]
  publish = "."
[functions]
  directory = "netlify/functions"

# The site is published from the repo root, so everything in the repo would be a public
# address: the functions' source (with the Drive folder ids in it), the SQL and the
# internal notes. These are answered with a 404 instead. /.netlify/functions/* is a
# different path and keeps working.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/HANDOFF-lowen-coaches-hub.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/BBL-API.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/JSON-SCHEMAS.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/STATS-SETUP.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/START-HERE.txt"
  to = "/404.html"
  status = 404
  force = true

# The browser keeps a copy and asks every time whether it is still the current one: an
# unchanged page answers "not modified" with no body, so the 1 MB page and its scripts are
# not downloaded again on every visit, and a new deploy is still seen at once. no-store
# made every visit a full download.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
